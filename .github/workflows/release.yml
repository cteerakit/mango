name: Release Mango

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Mango.Tests/Mango.Tests.csproj -c Release

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build self-contained x64 setup installer
        shell: pwsh
        run: ./scripts/Build-Installer.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v', '') -OutputDirectory "$env:RUNNER_TEMP/release"
      - name: Verify installation and startup
        shell: pwsh
        run: ./scripts/Test-Installer.ps1 -InstallerPath "$env:RUNNER_TEMP/release/MangoSetup-x64.exe" -Version ($env:GITHUB_REF_NAME -replace '^v', '')
      - uses: actions/upload-artifact@v4
        with:
          name: release-x64
          path: |
            ${{ runner.temp }}/release/MangoSetup-x64.exe
            ${{ runner.temp }}/release/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-x64
          path: release
      - name: Publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes --notes-file distribution/release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
